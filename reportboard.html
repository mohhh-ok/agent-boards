<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>reportboard</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #ffffff;
    --bar-bg: #f6f7f9;
    --text: #1b1f24;
    --sub: #4a525e;
    --line: #dfe3e8;
    --accent: #1f4fbf;
    --track: #e4e8ef;
    --code-bg: #eff1f4;
    --warn: #9a3412;
    --warn-bg: #fff3e8;
    --hover: #f4f6f9;
    --changed: #eaf0fd;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #16181c;
      --bar-bg: #1d2025;
      --text: #e6e8eb;
      --sub: #aab2bd;
      --line: #30353d;
      --accent: #8fb0ff;
      --track: #2c323b;
      --code-bg: #262a31;
      --warn: #fdba74;
      --warn-bg: #3a2416;
      --hover: #1c1f24;
      --changed: #1f2a44;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--page); color: var(--text); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    font-size: 15px;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "palt" 0;
  }

  /* ---- top bar ---- */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: baseline; gap: 12px;
    padding: 10px 28px;
    background: var(--bar-bg);
    border-bottom: 1px solid var(--line);
    font-size: 13px;
  }
  .topbar .file { font-weight: 600; color: var(--text); }
  .topbar .dir { color: var(--sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
  .topbar .status { color: var(--sub); white-space: nowrap; }
  .topbar .status.is-fresh { color: var(--accent); font-weight: 600; }
  .topbar .status.is-warn { color: var(--warn); font-weight: 600; }
  .topbar .changes-jump { white-space: nowrap; }
  .topbar .changes-jump[hidden] { display: none; }
  /* What changed in the last reload: a bar on the left and a light tint, until the next reload */
  .report .is-changed { background: var(--changed); box-shadow: inset 3px 0 0 var(--accent); }
  .report tr.is-changed { box-shadow: none; }
  .report tr.is-changed > td { background: var(--changed); }
  .report tr.is-changed > td:first-child { box-shadow: inset 3px 0 0 var(--accent); }

  /* ---- layout ---- */
  .shell {
    display: grid;
    grid-template-columns: 1fr;
    max-width: 1520px;
    margin: 0 auto;
    padding: 0 28px;
  }
  .toc { display: none; }
  @media (min-width: 1180px) {
    .shell { grid-template-columns: 220px minmax(0, 1fr); column-gap: 48px; }
    .toc {
      display: block;
      position: sticky; top: 45px;
      align-self: start;
      max-height: calc(100vh - 45px);
      overflow-y: auto;
      padding: 32px 0 24px;
    }
  }
  .toc-label { font-size: 13px; font-weight: 600; color: var(--sub); margin: 0 0 8px; }
  .toc ol { list-style: none; margin: 0; padding: 0; }
  .toc a {
    display: block;
    padding: 5px 0 5px 12px;
    border-left: 2px solid var(--line);
    color: var(--sub);
    text-decoration: none;
    font-size: 14px;
    line-height: 1.5;
  }
  .toc a:hover { color: var(--text); }
  .toc a.is-current { color: var(--text); border-left-color: var(--accent); font-weight: 600; }

  /* ---- report body ---- */
  .report { padding: 28px 0 96px; min-width: 0; }
  /* Running text stops at a reading width; rules, tables, breakdowns and conversation boxes use the whole column,
     so every line and box ends at the same right edge */
  .report > p, .report > ul, .report > ol:not(.ledger), .report > blockquote, .report > pre { max-width: 54em; }
  .report h1.report-title { font-size: 26px; line-height: 1.4; margin: 4px 0 16px; font-weight: 700; }
  .report h1:not(.report-title) { font-size: 22px; margin: 40px 0 12px; }
  .report h2 {
    font-size: 19px; line-height: 1.45; font-weight: 700;
    margin: 40px 0 12px; padding-top: 20px;
    border-top: 1px solid var(--line);
    max-width: none;
    scroll-margin-top: 56px;
  }
  .report h3 { font-size: 16px; margin: 28px 0 8px; }
  .report h4 { font-size: 15px; margin: 20px 0 6px; }
  .report p { margin: 0 0 12px; }
  .report ul, .report ol { margin: 0 0 14px; padding-left: 1.4em; }
  .report li { margin: 4px 0; }
  .report li::marker { color: var(--sub); }
  .report a { color: var(--accent); text-underline-offset: 2px; }
  .report code {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 0.88em;
    background: var(--code-bg);
    border-radius: 4px;
    padding: 1px 5px;
    /* Long paths break instead of pushing the page sideways on a narrow window */
    overflow-wrap: anywhere;
  }
  .report pre { background: var(--code-bg); padding: 12px 14px; border-radius: 6px; overflow-x: auto; line-height: 1.55; }
  .report pre code { background: none; padding: 0; font-size: 13px; }
  .report hr { border: 0; border-top: 1px solid var(--line); margin: 28px 0; }
  .report img { max-width: 100%; height: auto; }
  .report strong { font-weight: 700; }
  .report .qty { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  /* Long lists use the width of a wide window instead of running down the page */
  @media (min-width: 1100px) {
    .report > :is(ul, ol:not(.ledger)).is-long { max-width: none; columns: 2 26em; column-gap: 56px; }
    .report > .is-long > li { break-inside: avoid; }
  }
  .report blockquote.note {
    margin: 0 0 14px; padding: 2px 0 2px 14px;
    border-left: 3px solid var(--line);
    color: var(--text);
  }
  .report blockquote.note p:last-child { margin-bottom: 0; }

  /* ---- bars (ledger and numeric table columns) ---- */
  .bar { display: block; height: 4px; background: var(--track); border-radius: 2px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--accent); }

  /* ---- ledger: "<name> — <number> <unit>. details" lists ---- */
  .ledger-tools { scroll-margin-top: 56px; display: flex; justify-content: space-between; align-items: baseline; gap: 16px; margin: -6px 0 4px; }
  .ledger-scale { font-size: 14px; color: var(--text); }
  .ledger-scale .qty { font-weight: inherit; }
  .ledger-all { white-space: nowrap; }
  .text-button {
    font: inherit; font-size: 13px; color: var(--accent);
    background: none; border: 0; padding: 2px 0; cursor: pointer;
    text-decoration: underline; text-underline-offset: 3px;
  }
  .report .ledger { list-style: none; margin: 0 0 20px; padding: 0; border-top: 1px solid var(--line); }
  .ledger-tools[hidden] { display: none; }
  .ledger-row {
    display: grid;
    grid-template-columns: 7.5em minmax(14em, 22em) minmax(0, 1fr) 20px;
    column-gap: 24px;
    /* The number, the name and the first line of the details share one baseline */
    align-items: first baseline;
    margin: 0;
    padding: 7px 8px;
    border-bottom: 1px solid var(--line);
  }
  .ledger-row.has-more { cursor: pointer; }
  .ledger-row.has-more:hover { background: var(--hover); }
  /* The number slot is sized in the number's own font, so "6.25" and "9" end at the same place and the units line up */
  .ledger-value { display: grid; grid-template-columns: max-content 1fr; align-items: baseline; column-gap: 5px; }
  .ledger-num { text-align: right; min-width: 2.3em; }
  .ledger-num { font-size: 20px; line-height: 1.3; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--accent); }
  .ledger-unit { font-size: 13px; color: var(--sub); }
  .ledger-value .bar { grid-column: 1 / -1; margin-top: 6px; }
  .ledger-name { font-weight: 600; line-height: 1.55; }
  .ledger-body { line-height: 1.6; }
  /* Details written as a nested list of the work and `>` notes under the item */
  .ledger-text > :first-child { margin-top: 0; }
  .ledger-text > :last-child { margin-bottom: 0; }
  .ledger-text p, .ledger-text ul, .ledger-text ol { margin: 0 0 6px; }
  .ledger-text ul { list-style: disc; }
  .ledger-text li { margin: 1px 0; }
  .ledger-text blockquote.note { margin: 6px 0 0; padding: 0 0 0 12px; color: var(--sub); }
  .ledger-row:not(.is-open) .ledger-name,
  .ledger-row:not(.is-open) .ledger-text {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    overflow: hidden;
  }
  .ledger-more {
    grid-column: 4; grid-row: 1;
    align-self: start;
    width: 20px; height: 26px; padding: 0;
    background: none; border: 0; cursor: pointer;
    color: var(--sub);
  }
  .ledger-more::before {
    content: ""; display: block; width: 7px; height: 7px; margin: 6px auto 0;
    border-right: 2px solid currentColor; border-bottom: 2px solid currentColor;
    transform: rotate(45deg);
    transition: transform 0.15s;
  }
  .ledger-row.is-open .ledger-more::before { transform: rotate(-135deg); margin-top: 11px; }
  .ledger-row.has-more:hover .ledger-more { color: var(--accent); }
  .ledger-row:not(.has-more) .ledger-more { visibility: hidden; }
  /* "Edit with AI" on a row: under its details, seen when the row is open. The conversation spans the row */
  .ledger-body > .edit-with-ai { display: block; margin-top: 6px; }
  .ledger-row:not(.is-open) > .ledger-body > .edit-with-ai,
  .ledger-row:not(.is-open) > .thread { display: none; }
  .ledger-row > .thread { grid-column: 1 / -1; margin: 10px 0 4px; cursor: auto; }
  @media (max-width: 860px) {
    .ledger-row { grid-template-columns: 6.5em minmax(0, 1fr) 20px; }
    .ledger-body { grid-column: 2; }
    .ledger-more { grid-column: 3; }
  }
  /* A phone: the details take the width of the row, under the number and the name */
  @media (max-width: 560px) {
    .ledger-body { grid-column: 1 / 3; margin-top: 4px; }
  }

  /* ---- tables ---- */
  .table-wrap { overflow-x: auto; margin: 4px 0 20px; }
  .report table { border-collapse: collapse; font-size: 14px; line-height: 1.6; width: 100%; }
  .report th, .report td { padding: 8px 14px; border-bottom: 1px solid var(--line); vertical-align: top; text-align: left; }
  .report thead th { font-weight: 600; color: var(--sub); border-bottom: 2px solid var(--line); white-space: nowrap; }
  .report th.num, .report td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .report td.num .num-value { display: block; font-weight: 700; }
  .report td.num .bar { width: 72px; margin: 4px 0 2px auto; }
  .report tr.total-row td { font-weight: 700; border-top: 2px solid var(--sub); }

  /* ---- conversations with the AI, per section ---- */
  .section-heading { display: flex; align-items: baseline; gap: 16px; }
  .section-heading .heading-text { flex: 0 1 auto; }
  .edit-with-ai {
    flex: none;
    font: inherit; font-size: 13px; font-weight: 400; line-height: 1.4;
    color: var(--accent);
    background: none; border: 0; padding: 2px 0; cursor: pointer;
    text-decoration: underline; text-underline-offset: 3px;
  }
  .edit-with-ai:hover { color: var(--text); }
  .thread {
    margin: 4px 0 18px;
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: 4px;
    background: var(--bar-bg);
  }
  .thread[hidden] { display: none; }
  .thread-origin { padding: 10px 14px 0; font-size: 13px; color: var(--sub); }
  /* Long conversations scroll inside the box (kept at the latest message), so the section's content stays in view */
  .thread-messages { list-style: none; margin: 0; padding: 4px 0; max-height: 15em; overflow-y: auto; }
  .thread-messages:empty { display: none; }
  .message-item { margin: 0; padding: 8px 14px; }
  .message-item + .message-item { border-top: 1px solid var(--line); }
  .message-head { display: flex; gap: 10px; align-items: baseline; font-size: 13px; color: var(--sub); }
  .message-from { font-weight: 700; color: var(--text); }
  .message-item.from-ai .message-from { color: var(--accent); }
  .message-text { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 2px; }
  .composer { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 10px; padding: 8px 14px 10px; border-top: 1px solid var(--line); }
  .thread-messages:empty + .composer { border-top: 0; }
  .composer textarea {
    font: inherit; color: var(--text); background: var(--page);
    border: 1px solid var(--line); border-radius: 4px;
    padding: 7px 10px; resize: vertical; min-height: 38px; line-height: 1.6;
  }
  .composer textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .send-button {
    align-self: start;
    font: inherit; font-size: 14px; font-weight: 600;
    color: #fff; background: var(--accent);
    border: 0; border-radius: 4px; padding: 8px 14px; cursor: pointer;
  }
  @media (prefers-color-scheme: dark) { .send-button { color: #10131a; } }
  .send-button:disabled { opacity: 0.5; cursor: default; }
  .composer-status { grid-column: 1 / -1; font-size: 13px; color: var(--sub); }
  /* A phone: the box takes the whole width and the send button goes under it */
  @media (max-width: 560px) {
    .composer { grid-template-columns: minmax(0, 1fr); }
    .composer textarea { min-height: 5.6em; }
    .send-button { justify-self: end; }
  }
  .composer-status.is-error { color: var(--warn); }
  .orphans h2 { display: block; }

  /* ---- states ---- */
  .message { max-width: 40em; margin: 64px auto; color: var(--sub); text-align: center; }
  .message.is-error { color: var(--warn); }
</style>
</head>
<body>
<header class="topbar">
  <span class="file" id="file"></span>
  <span class="dir" id="dir"></span>
  <button type="button" class="text-button changes-jump" id="changes-jump" hidden></button>
  <span class="status" id="status"></span>
</header>
<div class="shell">
  <nav class="toc" id="toc" hidden>
    <p class="toc-label" data-i18n="contents"></p>
    <ol id="toc-list"></ol>
  </nav>
  <main class="report" id="report"><p class="message" data-i18n="loading"></p></main>
</div>
<script>
"use strict";
const STRINGS = {
  ja: {
    loading: "読み込み中…",
    loadFailed: "レポートを読み込めませんでした",
    contents: "目次",
    reloaded: (time) => `${time} に更新を読み直しました`,
    changes: (n) => `変わった所 ${n} か所 — 見る`,
    openedAt: (time) => `${time} 更新のファイル`,
    missing: "ファイルが見つかりません（移動か削除されました）。最後に読んだ内容を表示しています",
    more: "続きを読む",
    less: "閉じる",
    barScale: (max) => `棒の長さは、この一覧で最大の ${max} に対する割合`,
    columnScale: "棒の長さは、この列で最大の値に対する割合",
    openAll: "内訳をすべて開く",
    closeAll: "内訳をすべて閉じる",
    ask: "AI と直す",
    conversation: (n) => `AI とのやり取り（${n}）`,
    hideConversation: "やり取りを閉じる",
    you: "あなた",
    ai: "AI",
    placeholder: "このセクションの直し方か、聞きたいことを書く（例: 表に合計の行を足して）。Enter で送る、Shift+Enter で改行",
    rowPlaceholder: "この項目の直し方か、聞きたいことを書く（例: テストを 0.5 人日に減らして）。Enter で送る、Shift+Enter で改行",
    send: "送る",
    sending: "送っています…",
    waiting: "AI が受け取り待ちです。送るとすぐ届きます",
    notWaiting: "AI は今、受け取り待ちではありません。送った内容は保存されます。AI との会話で「reportboard を見て」と伝えると届きます",
    awaitingReply: "送りました。AI の返事はここに出ます",
    sendFailed: (e) => `送れませんでした: ${e}`,
    orphans: "見出しが見つからないやり取り",
    orphanOrigin: (h) => `元の見出し: ${h}`,
  },
  en: {
    loading: "Loading…",
    loadFailed: "Could not load the report",
    contents: "Contents",
    reloaded: (time) => `Reloaded the changes at ${time}`,
    changes: (n) => `${n} change${n === 1 ? "" : "s"} — show`,
    openedAt: (time) => `File updated ${time}`,
    missing: "The file is gone (moved or deleted). Showing what was last read",
    more: "Read more",
    less: "Show less",
    barScale: (max) => `Bars show each value against the largest in this list (${max})`,
    columnScale: "Bars show each value against the largest in this column",
    openAll: "Open all details",
    closeAll: "Close all details",
    ask: "Edit with AI",
    conversation: (n) => `Conversation with the AI (${n})`,
    hideConversation: "Hide the conversation",
    you: "You",
    ai: "AI",
    placeholder: "Say how to change this section, or ask about it (e.g. add a total row to the table). Enter to send, Shift+Enter for a new line",
    rowPlaceholder: "Say how to change this item, or ask about it (e.g. cut the tests to 0.5 days). Enter to send, Shift+Enter for a new line",
    send: "Send",
    sending: "Sending…",
    waiting: "The AI is waiting. What you send reaches it right away",
    notWaiting: "The AI is not waiting right now. What you send is kept; tell the AI \"check reportboard\" in your conversation to deliver it",
    awaitingReply: "Sent. The AI's reply will appear here",
    sendFailed: (e) => `Could not send: ${e}`,
    orphans: "Conversations whose heading is gone",
    orphanOrigin: (h) => `Original heading: ${h}`,
  },
};
const params = new URLSearchParams(location.search);
const rid = params.get("rid");
const lang = params.get("lang") === "ja" || (params.get("lang") === null && navigator.language.startsWith("ja")) ? "ja" : "en";
const T = STRINGS[lang];
document.documentElement.lang = lang;
for (const el of document.querySelectorAll("[data-i18n]")) el.textContent = T[el.dataset.i18n];

const $report = document.getElementById("report");
const $toc = document.getElementById("toc");
const $tocList = document.getElementById("toc-list");
const $status = document.getElementById("status");
let statusTimer = null;

function timeOf(ms) {
  return new Date(ms).toLocaleTimeString(lang === "ja" ? "ja-JP" : "en-US", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
}

function setStatus(text, kind) {
  $status.textContent = text;
  $status.className = "status" + (kind ? ` is-${kind}` : "");
}

// Rows are keyed by their name, so the ones the user opened stay open when the file is reloaded
function openRowKeys() {
  return new Set([...document.querySelectorAll(".ledger-row.is-open .ledger-name")].map((el) => el.textContent));
}

function render(report, { keepOpen }) {
  document.getElementById("file").textContent = report.name;
  document.getElementById("dir").textContent = report.dir;
  document.title = report.title ?? report.name;
  const focusedKey = document.activeElement?.closest?.(".thread")?.dataset.key ?? null;
  $report.innerHTML = report.html;

  $tocList.replaceChildren(
    ...report.headings.map((h) => {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.href = `#${h.id}`;
      a.textContent = h.text;
      li.append(a);
      return li;
    }),
  );
  $toc.hidden = report.headings.length < 2;

  // Every row gets its open/close button here, short ones too: "Edit with AI" can make a row openable later.
  // measureRows decides whether it is shown
  for (const row of document.querySelectorAll(".ledger-row")) {
    const body = row.querySelector(".ledger-body");
    if (body) {
      const text = document.createElement("div");
      text.className = "ledger-text";
      text.append(...body.childNodes);
      body.append(text);
    }
    const more = document.createElement("button");
    more.type = "button";
    more.className = "ledger-more";
    row.append(more);
    setRowOpen(row, keepOpen.has(row.querySelector(".ledger-name").textContent));
  }
  for (const th of $report.querySelectorAll("th.num")) th.title = T.columnScale;
  for (const list of $report.querySelectorAll(":scope > ul, :scope > ol:not(.ledger)")) {
    list.classList.toggle("is-long", list.children.length >= 6);
  }
  for (const ledger of document.querySelectorAll(".ledger")) {
    const tools = document.createElement("div");
    tools.className = "ledger-tools";
    const scale = document.createElement("span");
    scale.className = "ledger-scale";
    if (ledger.dataset.max) {
      // The largest value and its unit stay on one line
      const [before, after = ""] = T.barScale("\u0000").split("\u0000");
      const qty = document.createElement("span");
      qty.className = "qty";
      qty.textContent = `${ledger.dataset.max} ${ledger.dataset.unit}`.trim();
      scale.append(before, qty, after);
    }
    const all = document.createElement("button");
    all.type = "button";
    all.className = "text-button ledger-all";
    tools.append(scale, all);
    ledger.before(tools);
  }
  sections = report.sections;
  canTalk = report.canTalk;
  buildThreadPanels();
  renderThreads(report.threads);
  if (focusedKey !== null) document.querySelector(`.thread[data-key="${CSS.escape(focusedKey)}"] textarea`)?.focus();
  measureRows();
  updateCurrentSection();
}

// ---------------- Conversations with the AI ----------------
let sections = [];
let canTalk = false;
let threads = [];
let aiWaiting = false;
// Kept across re-renders: what the user is typing, which panels are open, and where the focus was
const drafts = new Map();
const openPanels = new Set();
const sentAwaiting = new Set();
const seenPanels = new Set();

function panelKey(section) {
  const key = `h${section.level}:${section.occurrence}:${section.text}`;
  return section.row ? `${key}|row:${section.row.occurrence}:${section.row.name}` : key;
}

function makeAskButton(key) {
  const button = document.createElement("button");
  button.type = "button";
  button.className = "edit-with-ai";
  button.dataset.key = key;
  return button;
}

function buildThreadPanels() {
  document.getElementById("orphans")?.remove();
  for (const section of sections) {
    if (section.row) {
      // A breakdown row: the button closes its details, and the conversation takes the width of the row
      const row = document.getElementById(section.id);
      if (!row || !canTalk) continue;
      let body = row.querySelector(".ledger-body");
      if (!body) {
        body = document.createElement("div");
        body.className = "ledger-body";
        row.querySelector(".ledger-name").after(body);
      }
      const key = panelKey(section);
      body.append(makeAskButton(key));
      row.append(makePanel({ key, section, threadId: null }));
      continue;
    }
    const heading = document.getElementById(section.id);
    if (!heading) continue;
    // The heading is a flex row; its text stays one item whether or not the button is added
    const text = document.createElement("span");
    text.className = "heading-text";
    text.append(...heading.childNodes);
    heading.append(text);
    if (!canTalk) continue;
    heading.append(makeAskButton(panelKey(section)));
    heading.after(makePanel({ key: panelKey(section), section, threadId: null }));
  }
}

function makePanel({ key, section, threadId, origin }) {
  const panel = document.createElement("div");
  panel.className = "thread";
  panel.dataset.key = key;
  panel.hidden = !openPanels.has(key);
  if (origin) {
    const p = document.createElement("p");
    p.className = "thread-origin";
    p.textContent = T.orphanOrigin(origin);
    panel.append(p);
  }
  const list = document.createElement("ol");
  list.className = "thread-messages";
  const composer = document.createElement("form");
  composer.className = "composer";
  const box = document.createElement("textarea");
  box.rows = 1;
  box.placeholder = section.row ? T.rowPlaceholder : T.placeholder;
  box.value = drafts.get(key) ?? "";
  box.addEventListener("input", () => drafts.set(key, box.value));
  box.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
      event.preventDefault();
      composer.requestSubmit();
    }
  });
  const send = document.createElement("button");
  send.type = "submit";
  send.className = "send-button";
  send.textContent = T.send;
  const status = document.createElement("p");
  status.className = "composer-status";
  status.setAttribute("aria-live", "polite");
  composer.append(box, send, status);
  composer.addEventListener("submit", (event) => {
    event.preventDefault();
    sendFrom(panel);
  });
  panel.append(list, composer);
  panel._section = section;
  panel._threadId = threadId;
  return panel;
}

async function sendFrom(panel) {
  const box = panel.querySelector("textarea");
  const text = box.value.trim();
  if (text === "") return;
  const button = panel.querySelector(".send-button");
  const status = panel.querySelector(".composer-status");
  button.disabled = true;
  status.className = "composer-status";
  status.textContent = T.sending;
  try {
    const result = await window.__reportboardSend({ threadId: panel._threadId, section: panel._section, text });
    if (!result.ok) throw new Error(result.error);
    box.value = "";
    drafts.delete(panel.dataset.key);
    sentAwaiting.add(panel.dataset.key);
    status.textContent = "";
    renderThreads(result.threads);
  } catch (error) {
    status.className = "composer-status is-error";
    status.textContent = T.sendFailed(error?.message ?? error);
  } finally {
    button.disabled = false;
  }
}

function renderThreads(next) {
  threads = next ?? [];
  if (!canTalk) return;
  const placed = new Map();
  const orphans = [];
  for (const thread of threads) {
    if (thread.sectionId === null) orphans.push(thread);
    else placed.set(thread.sectionId, thread);
  }
  for (const section of sections) {
    const panel = document.querySelector(`.thread[data-key="${CSS.escape(panelKey(section))}"]`);
    if (panel) fillPanel(panel, placed.get(section.id) ?? null);
  }
  let box = document.getElementById("orphans");
  if (orphans.length === 0) {
    box?.remove();
  } else {
    if (!box) {
      box = document.createElement("section");
      box.id = "orphans";
      box.className = "orphans";
      const h = document.createElement("h2");
      h.textContent = T.orphans;
      box.append(h);
      $report.append(box);
    }
    for (const thread of orphans) {
      const key = `thread:${thread.id}`;
      let panel = box.querySelector(`.thread[data-key="${CSS.escape(key)}"]`);
      if (!panel) {
        openPanels.add(key);
        const origin = thread.heading.row ? `${thread.heading.text} › ${thread.heading.row.name}` : thread.heading.text;
        panel = makePanel({ key, section: thread.heading, threadId: thread.id, origin });
        box.append(panel);
      }
      fillPanel(panel, thread);
    }
  }
  updateWaiting();
}

function fillPanel(panel, thread) {
  const key = panel.dataset.key;
  panel._threadId = thread?.id ?? panel._threadId ?? null;
  const messages = thread?.messages ?? [];
  if (messages.length > 0 && messages[messages.length - 1].from === "ai") sentAwaiting.delete(key);
  if (messages.length > 0 && !seenPanels.has(key)) {
    // A section that already has a conversation shows it, once; after that the user decides
    openPanels.add(key);
    seenPanels.add(key);
    const row = panel.closest(".ledger-row");
    if (row) setRowOpen(row, true);
  }
  panel.hidden = !openPanels.has(key);
  const list = panel.querySelector(".thread-messages");
  list.replaceChildren(
    ...messages.map((m) => {
      const li = document.createElement("li");
      li.className = `message-item from-${m.from}`;
      const head = document.createElement("div");
      head.className = "message-head";
      const from = document.createElement("span");
      from.className = "message-from";
      from.textContent = m.from === "ai" ? T.ai : T.you;
      const at = document.createElement("time");
      at.textContent = timeOf(Date.parse(m.at));
      head.append(from, at);
      const text = document.createElement("div");
      text.className = "message-text";
      text.textContent = m.text;
      li.append(head, text);
      return li;
    }),
  );
  list.scrollTop = list.scrollHeight;
  const button = document.querySelector(`.edit-with-ai[data-key="${CSS.escape(key)}"]`);
  if (button) button.textContent = panel.hidden ? (messages.length > 0 ? T.conversation(messages.length) : T.ask) : T.hideConversation;
}

function updateWaiting() {
  for (const panel of document.querySelectorAll(".thread")) {
    const status = panel.querySelector(".composer-status");
    if (status.classList.contains("is-error") || status.textContent === T.sending) continue;
    status.textContent = sentAwaiting.has(panel.dataset.key) ? T.awaitingReply : aiWaiting ? T.waiting : T.notWaiting;
  }
}

document.addEventListener("click", (event) => {
  const button = event.target.closest(".edit-with-ai");
  if (!button) return;
  const panel = document.querySelector(`.thread[data-key="${CSS.escape(button.dataset.key)}"]`);
  if (!panel) return;
  const key = panel.dataset.key;
  if (openPanels.has(key)) openPanels.delete(key);
  else openPanels.add(key);
  renderThreads(threads);
  if (!panel.hidden) panel.querySelector("textarea").focus();
});

// A row can be opened only when its details are longer than the two lines shown
function measureRows() {
  for (const row of document.querySelectorAll(".ledger-row")) {
    const text = row.querySelector(".ledger-text");
    const name = row.querySelector(".ledger-name");
    const wasOpen = row.classList.contains("is-open");
    row.classList.remove("is-open");
    const clipped = (text !== null && text.scrollHeight > text.clientHeight + 1) || name.scrollHeight > name.clientHeight + 1;
    if (wasOpen) row.classList.add("is-open");
    // A row with "Edit with AI" opens to show the button even when its details fit
    const canOpen = clipped || row.querySelector(".edit-with-ai") !== null;
    row.classList.toggle("has-more", canOpen);
    setRowOpen(row, wasOpen && canOpen);
  }
  for (const tools of document.querySelectorAll(".ledger-tools")) {
    const rows = [...tools.nextElementSibling.querySelectorAll(".ledger-row.has-more")];
    tools.querySelector(".ledger-all").hidden = rows.length === 0;
    const allOpen = rows.length > 0 && rows.every((r) => r.classList.contains("is-open"));
    tools.querySelector(".ledger-all").textContent = allOpen ? T.closeAll : T.openAll;
  }
}

function setRowOpen(row, open) {
  row.classList.toggle("is-open", open);
  row.querySelector(".ledger-more").setAttribute("aria-label", open ? T.less : T.more);
  row.querySelector(".ledger-more").title = open ? T.less : T.more;
}

document.addEventListener("click", (event) => {
  const link = event.target.closest("a[href]");
  if (link) {
    event.preventDefault();
    const href = link.getAttribute("href");
    if (href.startsWith("#")) document.getElementById(decodeURIComponent(href.slice(1)))?.scrollIntoView({ block: "start" });
    else window.__reportboardOpen(href);
    return;
  }
  const all = event.target.closest(".ledger-all");
  if (all) {
    const rows = [...all.parentElement.nextElementSibling.querySelectorAll(".ledger-row.has-more")];
    const open = !rows.every((r) => r.classList.contains("is-open"));
    for (const row of rows) setRowOpen(row, open);
    measureRows();
    return;
  }
  // The button and the conversation inside a row do not open or close it
  if (event.target.closest(".edit-with-ai, .thread")) return;
  const row = event.target.closest(".ledger-row.has-more");
  // Selecting text inside a row should not toggle it
  if (row && String(window.getSelection()).length === 0) {
    setRowOpen(row, !row.classList.contains("is-open"));
    measureRows();
  }
});

function updateCurrentSection() {
  const links = [...$tocList.querySelectorAll("a")];
  if (links.length === 0) return;
  let current = links[0];
  for (const a of links) {
    const heading = document.getElementById(a.getAttribute("href").slice(1));
    if (heading && heading.getBoundingClientRect().top < 120) current = a;
  }
  if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2) current = links[links.length - 1];
  for (const a of links) a.classList.toggle("is-current", a === current);
}
window.addEventListener("scroll", updateCurrentSection, { passive: true });
let resizeTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(measureRows, 100);
});

document.addEventListener("keydown", (event) => {
  if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "w") {
    event.preventDefault();
    window.__reportboardClose();
  }
});

// ---------------- What changed in a reload ----------------
// Compared by text, block by block (table rows, list items, paragraphs, headings, code, notes). A block whose text was
// not in the previous rendering is new or changed. Conversation boxes are not part of the report and are skipped
const BLOCKS = ":scope > p, :scope > blockquote, :scope > pre, tr, li, h1, h2, h3, h4";
const changed = [];
let changeIndex = 0;
const $jump = document.getElementById("changes-jump");

function blocksNow() {
  return [...$report.querySelectorAll(BLOCKS)].filter((el) => !el.closest(".thread") && !el.closest("thead"));
}

// The report's own text: the buttons and conversation boxes inside a heading or a breakdown row are left out
function blockText(el) {
  const copy = el.cloneNode(true);
  for (const extra of copy.querySelectorAll(".edit-with-ai, .thread, .ledger-more")) extra.remove();
  return copy.textContent.replace(/\s+/g, " ").trim();
}

function blockTexts() {
  const counts = new Map();
  for (const el of blocksNow()) {
    const key = blockText(el);
    counts.set(key, (counts.get(key) ?? 0) + 1);
  }
  return counts;
}

function markChanges(before) {
  changed.length = 0;
  changeIndex = 0;
  const found = [];
  for (const el of blocksNow()) {
    const key = blockText(el);
    const left = before.get(key) ?? 0;
    if (left > 0) before.set(key, left - 1);
    else found.push(el);
  }
  // A list item whose nested item changed has changed text too; mark only the innermost block
  for (const el of found) {
    if (found.some((other) => other !== el && el.contains(other))) continue;
    el.classList.add("is-changed");
    changed.push(el);
  }
  $jump.hidden = changed.length === 0;
  if (changed.length > 0) $jump.textContent = T.changes(changed.length);
}

$jump.addEventListener("click", () => {
  if (changed.length === 0) return;
  changed[changeIndex % changed.length].scrollIntoView({ block: "center" });
  changeIndex += 1;
});

async function poll() {
  try {
    const result = await window.__reportboardPoll();
    if (result.replaceUrl) {
      location.replace(result.replaceUrl);
      return;
    }
    if (result.waiting !== aiWaiting) {
      aiWaiting = result.waiting;
      updateWaiting();
    }
    if (result.threads) renderThreads(result.threads);
    if (result.missing) setStatus(T.missing, "warn");
    else if (result.report) {
      const y = window.scrollY;
      const before = blockTexts();
      render(result.report, { keepOpen: openRowKeys() });
      window.scrollTo(0, y);
      markChanges(before);
      setStatus(T.reloaded(timeOf(Date.now())), "fresh");
      clearTimeout(statusTimer);
      statusTimer = setTimeout(() => setStatus(T.openedAt(timeOf(result.report.modifiedAt))), 4000);
    } else if ($status.classList.contains("is-warn")) setStatus("");
  } finally {
    setTimeout(poll, 500);
  }
}

let loadError = null;
(async () => {
  try {
    const report = await window.__reportboardLoad(rid);
    if (report.error) throw new Error(report.error);
    render(report, { keepOpen: new Set() });
    setStatus(T.openedAt(timeOf(report.modifiedAt)));
    loadError = null;
  } catch (error) {
    loadError = error?.message ?? String(error);
    $report.innerHTML = "";
    const p = document.createElement("p");
    p.className = "message is-error";
    p.textContent = `${T.loadFailed}: ${loadError}`;
    $report.append(p);
  }
  // Not awaited: a bound function that returns nothing may never settle its promise, and polling must start anyway
  Promise.resolve(window.__reportboardReady(rid, loadError)).catch(() => {});
  setTimeout(poll, 500);
})();
</script>
