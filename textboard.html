<!DOCTYPE html>
<!--
  textboard.html — a window where the user edits a text file (mostly Markdown or plain text) directly, comments on any
  passage, and sends instructions to the AI (the calling agent). No build step and no external dependencies
  (it only loads anchor.js and enterKey.js from the same directory).

  - The text is edited as is in a textarea. A #mirror with the same typesetting sits behind it and highlights the commented ranges
  - Reading and writing files and sending instructions go through the __textboard* functions that textboard.ts injects with webview.bind
  - How to launch it is defined in README.md (opened in textboard.ts's webview-bun window)
  - When opened over http for verification, the verification script injects functions with the same names (docs/development.md)
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>textboard</title>
<style>
  :root {
    --page-bg: #151515;
    --header-bg: #1e1e1e;
    --panel-bg: #1d1d1d;
    --card-bg: #232323;
    --border: #333;
    --fg: #d8d8d8;
    --fg-dim: #8a8a8a;
    --text: #e6e6e6;
    --accent: #e0a63a;
    --hl: rgba(224, 166, 58, 0.22);
    --hl-active: rgba(224, 166, 58, 0.5);
    --hl-draft: rgba(96, 150, 240, 0.38);
    --blue: #6a9cf0;
    --warn-bg: #3a2c12;
    --error-bg: #3a1a1a;
    --ok: #6cbf7f;
    --doc-font: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Helvetica Neue", sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--page-bg);
    color: var(--fg);
    font-family: -apple-system, "Hiragino Sans", "Helvetica Neue", Arial, sans-serif;
    font-size: 13px;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    flex-direction: column;
  }

  button {
    font: inherit;
    color: var(--fg);
    background: #2c2c2c;
    border: 1px solid #3a3a3a;
    border-radius: 4px;
    padding: 4px 10px;
    cursor: pointer;
  }
  button:hover { background: #343434; }
  button:disabled { opacity: 0.45; cursor: default; }
  button.primary { background: #3b5f9e; border-color: #4a70b4; color: #fff; }
  button.primary:hover { background: #4469ab; }
  button.link {
    background: none;
    border: none;
    padding: 0;
    color: var(--fg-dim);
  }
  button.link:hover { color: var(--fg); text-decoration: underline; }
  kbd {
    font: inherit;
    color: var(--fg-dim);
    margin-left: 6px;
  }

  /* ---- header ---- */
  header {
    flex: none;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 16px;
    background: var(--header-bg);
    border-bottom: 1px solid var(--border);
  }
  #file-name { font-weight: 600; font-size: 14px; }
  #file-dir {
    color: var(--fg-dim);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
    flex: 1;
  }
  /* Comments that lost their place sit at the top of the margin; when the user is further down, this says so */
  #lost-jump { white-space: nowrap; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
  #lost-jump[hidden] { display: none; }
  #save-state { color: var(--fg-dim); white-space: nowrap; }
  #save-state.dirty { color: var(--accent); }
  #save-state.dirty::before { content: "● "; }

  /* ---- banners ---- */
  #banners:empty { display: none; }
  .banner {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--panel-bg);
  }
  .banner.warn { background: var(--warn-bg); }
  .banner.error { background: var(--error-bg); }
  .banner .msg { flex: 1; line-height: 1.5; }
  .banner .actions { display: flex; gap: 8px; }

  /* ---- document ---- */
  #scroller {
    flex: 1;
    overflow: auto;
    position: relative;
  }
  #doc {
    display: grid;
    grid-template-columns: minmax(0, 760px) 300px;
    column-gap: 40px;
    justify-content: center;
    padding: 36px 28px 80px;
  }
  @media (max-width: 1000px) {
    #doc { grid-template-columns: minmax(0, 1fr) 260px; column-gap: 24px; }
  }

  #editor-wrap { position: relative; }
  #mirror, #editor {
    font-family: var(--doc-font);
    font-size: 15px;
    line-height: 1.85;
    letter-spacing: 0;
    tab-size: 4;
    white-space: pre-wrap;
    overflow-wrap: break-word;
    word-break: normal;
    margin: 0;
    padding: 0 0 40px;
    border: 0;
    width: 100%;
  }
  #mirror {
    color: transparent;
    min-height: 200px;
  }
  #mirror mark {
    color: transparent;
    background: var(--hl);
    border-radius: 2px;
  }
  #mirror mark.multi { background: rgba(224, 166, 58, 0.36); }
  #mirror mark.active { background: var(--hl-active); }
  #mirror mark.draft { background: var(--hl-draft); }
  #editor {
    position: absolute;
    inset: 0;
    height: 100%;
    background: transparent;
    color: var(--text);
    caret-color: #fff;
    resize: none;
    overflow: hidden;
    outline: none;
    -webkit-appearance: none;
  }
  #editor::selection { background: rgba(120, 160, 255, 0.35); }

  /* ---- margin (comments) ---- */
  #margin { position: relative; min-height: 100%; }
  #lost:empty { display: none; }
  #lost { margin-bottom: 16px; }
  #lost h2 {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    margin: 0 0 4px;
  }
  #lost .lost-hint { font-size: 12px; color: var(--fg-dim); margin: 0 0 8px; line-height: 1.5; }
  #cards { position: relative; }

  .card {
    position: absolute;
    left: 0;
    right: 0;
    background: var(--card-bg);
    border: 1px solid #2f2f2f;
    border-left: 3px solid rgba(224, 166, 58, 0.55);
    border-radius: 4px;
    padding: 8px 10px;
    line-height: 1.55;
    cursor: pointer;
    transition: top 0.12s ease-out;
  }
  #lost .card { position: relative; margin-bottom: 8px; border-left-color: #777; }
  .card.active { border-color: #4a4a4a; border-left-color: var(--accent); background: #292723; }
  .card.draft { border-left-color: var(--blue); cursor: default; }
  .card .quote {
    color: var(--fg-dim);
    font-size: 12px;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    margin-bottom: 4px;
  }
  /* The comment text is an input you can click and edit in place. It looks like plain text until hovered or focused */
  .card textarea.body {
    display: block;
    width: calc(100% + 10px);
    margin: 0 -5px;
    padding: 2px 4px;
    font: inherit;
    line-height: 1.55;
    color: var(--text);
    background: transparent;
    border: 1px solid transparent;
    border-radius: 3px;
    resize: none;
    overflow: hidden;
    outline: none;
    cursor: text;
  }
  .card textarea.body:hover { border-color: #3a3a3a; }
  .card textarea.body:focus { border-color: var(--blue); background: #1a1a1a; }
  .card .meta {
    display: flex;
    gap: 12px;
    margin-top: 6px;
    font-size: 12px;
  }
  .card .meta .line { color: var(--fg-dim); flex: 1; }
  .card .compose textarea {
    width: 100%;
    min-height: 64px;
    font: inherit;
    color: var(--text);
    background: #1a1a1a;
    border: 1px solid #3a3a3a;
    border-radius: 3px;
    padding: 6px;
    resize: vertical;
    outline: none;
  }
  .card .compose textarea:focus { border-color: var(--blue); }
  .card .edit-actions { display: flex; flex-wrap: wrap; gap: 6px 8px; margin-top: 6px; align-items: center; }
  .card .edit-actions button { white-space: nowrap; }
  .card .edit-actions .hint { flex-basis: 100%; color: var(--fg-dim); font-size: 12px; }
  .card .meta .hint { color: var(--fg-dim); font-size: 12px; }
  .card .meta .hint { display: none; flex: 1; }
  .card.editing .meta .hint { display: inline; }
  .card.editing .meta .line { display: none; }

  /* Shown right below the end of the selection. It may overlap the margin cards; the button stays in front */
  #add-comment {
    position: absolute;
    left: 0;
    z-index: 20;
    white-space: nowrap;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    display: none;
    background: #2a3a58;
    border-color: #3f5a8c;
    color: #fff;
  }
  #add-comment:hover { background: #33476c; }

  /* ---- composer (instruction for the AI) ---- */
  #composer {
    flex: none;
    border-top: 1px solid var(--border);
    background: var(--header-bg);
    padding: 10px 16px 10px;
  }
  #composer-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    max-width: 1100px;
    margin: 0 auto;
  }
  #instruction {
    flex: 1;
    min-height: 40px;
    max-height: 160px;
    font: inherit;
    font-size: 14px;
    line-height: 1.5;
    color: var(--text);
    background: #161616;
    border: 1px solid #3a3a3a;
    border-radius: 4px;
    padding: 8px 10px;
    resize: none;
    outline: none;
  }
  #instruction:focus { border-color: var(--blue); }
  #composer-actions { display: flex; gap: 8px; }
  #composer-actions button { height: 36px; }
  #composer-status {
    max-width: 1100px;
    margin: 6px auto 0;
    color: var(--fg-dim);
    font-size: 12px;
    display: flex;
    gap: 16px;
  }
  #agent-state { flex: 1; }
  #agent-state.waiting { color: var(--ok); }
  #agent-state.sent { color: var(--accent); }

  #load-error {
    display: none;
    flex: 1;
    align-items: center;
    justify-content: center;
    color: var(--fg-dim);
    font-size: 14px;
  }
</style>
</head>
<body>
<header>
  <span id="file-name"></span>
  <span id="file-dir"></span>
  <button id="lost-jump" class="link" hidden></button>
  <span id="save-state"></span>
  <button id="save-btn"><span data-i18n="save"></span><kbd>⌘S</kbd></button>
</header>
<div id="banners"></div>
<div id="scroller">
  <div id="doc">
    <div id="editor-wrap">
      <div id="mirror" aria-hidden="true"></div>
      <textarea id="editor" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
      <button id="add-comment"></button>
    </div>
    <aside id="margin">
      <div id="lost"></div>
      <div id="cards"></div>
    </aside>
  </div>
</div>
<div id="load-error"></div>
<footer id="composer">
  <div id="composer-row">
    <textarea id="instruction" rows="1"></textarea>
    <div id="composer-actions">
      <button id="copy-btn" data-i18n="copy"></button>
      <button id="send-btn" class="primary"><span data-i18n="send"></span><kbd style="color:#cfe0ff">↩</kbd></button>
    </div>
  </div>
  <div id="composer-status">
    <span id="agent-state"></span>
    <span id="hint"></span>
  </div>
</footer>
<script src="anchor.js"></script>
<script src="enterKey.js"></script>
<script>
(function () {
  "use strict";
  var A = window.TextboardAnchor;
  var POLL_MS = 500;

  var params = new URLSearchParams(window.location.search);
  var RID = params.get("rid");
  var LANG = params.get("lang") || ((navigator.language || "").toLowerCase().indexOf("ja") === 0 ? "ja" : "en");

  // Strings shown on screen. Add to both ja and en
  var STRINGS = {
    ja: {
      save: "保存",
      saved: "保存済み",
      unsaved: "未保存",
      savedAt: function (t) { return "保存しました " + t; },
      saveFailed: function (e) { return "保存できませんでした: " + e; },
      copy: "コピー",
      copied: "指示とコメントをクリップボードにコピーしました",
      copyFailed: "コピーできませんでした",
      send: "AI に送る",
      instructionPlaceholder: "AI への指示（例: コメントに沿って直して / もっと短く）。Enter で送る、Shift+Enter で改行",
      hint: "範囲を選んで ⌘⌥M でコメント",
      addComment: "＋ コメント",
      commentPlaceholder: "コメント",
      commentSave: "コメントする",
      commentUpdate: "更新",
      cancel: "やめる",
      bodyTitle: "クリックして直す",
      bodyHint: "Enter 確定 / Shift+Enter 改行 / Esc 取り消し",
      remove: "削除",
      reattach: "選択範囲に付け直す",
      lostTitle: function (n) { return "場所が分からなくなったコメント（" + n + "）"; },
      lostHint: "本文が書き換わって、引用した文が見つからなくなりました",
      lostJump: function (n) { return "場所が分からなくなったコメント " + n + " 件 — 見る"; },
      line: function (a, b) { return a === b ? a + " 行目" : a + "〜" + b + " 行目"; },
      editHint: "Enter 確定 / Shift+Enter 改行 / Esc やめる",
      agentWaiting: "AI が指示を待っています",
      agentIdle: "AI は今、受け取り待ちをしていません。送った指示は次に AI が受け取ります",
      agentSent: "送りました。AI の受け取りを待っています",
      agentSentIdle: "送りました。AI は今、受け取り待ちをしていません。AI に「textboard を見て」と伝えるか、コピーして会話に貼ってください",
      agentReceived: function (t) { return "AI が受け取りました " + t; },
      nothingToSend: "指示かコメントを書いてから送ってください",
      reloaded: function (t) { return "ファイルが外で書き換えられたので読み直しました " + t; },
      conflict: "ファイルが外で書き換えられました。未保存の編集があるので、読み直していません",
      takeDisk: "外の版を読み込む（自分の編集を捨てる）",
      keepMine: "自分の版で上書き保存",
      conflictFirst: "先に、外で書き換えられたファイルとの食い違いを解消してください",
      fileGone: "ファイルが見つかりません（消されたか移動されました）。保存すると作り直します",
      replaceRefused: "別のファイルを開く要求が来ましたが、未保存の編集があるので開きませんでした",
      closeArmed: "未保存の編集があります。保存せずに閉じるには、もう一度 ⌘W",
      sidecarUnreadable: function (p) { return "コメントのファイルを読めませんでした: " + p; },
      loadFailed: "ファイルを読み込めませんでした",
      dismiss: "閉じる",
      clipboardTitle: function (p) { return "textboard から: " + p; },
      clipboardInstruction: "指示:",
      clipboardComments: "コメント:",
      clipboardLine: function (a) { return a + " 行目"; },
      clipboardLost: "場所不明",
    },
    en: {
      save: "Save",
      saved: "Saved",
      unsaved: "Unsaved",
      savedAt: function (t) { return "Saved " + t; },
      saveFailed: function (e) { return "Could not save: " + e; },
      copy: "Copy",
      copied: "Copied the instruction and comments to the clipboard",
      copyFailed: "Could not copy",
      send: "Send to AI",
      instructionPlaceholder: "Instruction for the AI (e.g. address my comments / make it shorter). Enter to send, Shift+Enter for a new line",
      hint: "Select text and press ⌘⌥M to comment",
      addComment: "+ Comment",
      commentPlaceholder: "Comment",
      commentSave: "Comment",
      commentUpdate: "Update",
      cancel: "Cancel",
      bodyTitle: "Click to edit",
      bodyHint: "Enter to save / Shift+Enter: new line / Esc to undo",
      remove: "Delete",
      reattach: "Attach to selection",
      lostTitle: function (n) { return "Comments that lost their place (" + n + ")"; },
      lostHint: "The text changed and the quoted passage can no longer be found",
      lostJump: function (n) { return n + " comment" + (n === 1 ? "" : "s") + " lost their place — show"; },
      line: function (a, b) { return a === b ? "line " + a : "lines " + a + "–" + b; },
      editHint: "Enter to save / Shift+Enter for a new line / Esc to cancel",
      agentWaiting: "The AI is waiting for an instruction",
      agentIdle: "The AI is not listening right now. It will get what you send next time it checks",
      agentSent: "Sent. Waiting for the AI to pick it up",
      agentSentIdle: "Sent. The AI is not listening right now. Tell it to check textboard, or copy and paste into the conversation",
      agentReceived: function (t) { return "The AI picked it up " + t; },
      nothingToSend: "Write an instruction or a comment first",
      reloaded: function (t) { return "The file was changed outside, so it was reloaded " + t; },
      conflict: "The file was changed outside. You have unsaved edits, so it was not reloaded",
      takeDisk: "Load the outside version (discard my edits)",
      keepMine: "Overwrite with my version",
      conflictFirst: "Resolve the conflict with the outside change first",
      fileGone: "The file is gone (deleted or moved). Saving will create it again",
      replaceRefused: "A request to open another file came in, but you have unsaved edits, so it was not opened",
      closeArmed: "You have unsaved edits. Press ⌘W again to close without saving",
      sidecarUnreadable: function (p) { return "Could not read the comments file: " + p; },
      loadFailed: "Could not load the file",
      dismiss: "Dismiss",
      clipboardTitle: function (p) { return "From textboard: " + p; },
      clipboardInstruction: "Instruction:",
      clipboardComments: "Comments:",
      clipboardLine: function (a) { return "line " + a; },
      clipboardLost: "place lost",
    },
  };
  var S = STRINGS[LANG] || STRINGS.en;

  var $ = function (id) { return document.getElementById(id); };
  var editor = $("editor");
  var mirror = $("mirror");
  var scroller = $("scroller");
  var cardsEl = $("cards");
  var lostEl = $("lost");
  var lostJumpEl = $("lost-jump");
  lostJumpEl.addEventListener("click", function () { lostEl.scrollIntoView({ block: "start" }); });
  var addBtn = $("add-comment");
  var bannersEl = $("banners");
  var instructionEl = $("instruction");
  var saveStateEl = $("save-state");
  var agentStateEl = $("agent-state");

  var state = {
    path: null,
    sidecar: null,
    lineEnding: "\n",
    text: "",       // the current text (line endings normalized to \n)
    saved: "",      // the text on disk (same)
    comments: [],   // {id, start, end, body, created, updated, lost, quote, prefix, suffix}
    activeId: null,
    draft: null,    // the new comment being written {start, end}
    focusEditorOnce: false, // move focus to the draft comment's input on the next render
    conflict: null, // the outside text, when the file changed outside and conflicts with unsaved edits
    fileGone: false,
    lastSentId: null,
    lastSentDelivered: null,
    closeArmedUntil: 0,
  };

  function dirty() { return state.text !== state.saved; }
  function normalize(text) { return text.replace(/\r\n/g, "\n"); }
  function toDisk(text) { return state.lineEnding === "\r\n" ? text.replace(/\n/g, "\r\n") : text; }
  function clock() { return new Date().toLocaleTimeString(LANG === "ja" ? "ja-JP" : "en-US", { hour12: false }); }
  function newId() { return "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function visibleComments() { return state.comments.filter(function (c) { return !c.lost; }); }
  function call(name) {
    var fn = window[name];
    var args = Array.prototype.slice.call(arguments, 1);
    if (typeof fn !== "function") return Promise.reject(new Error(name + " is not available"));
    return Promise.resolve(fn.apply(null, args));
  }

  // ---------------- banners ----------------
  // One per key. Showing the same key again replaces it
  function showBanner(key, kind, message, actions) {
    hideBanner(key);
    var el = document.createElement("div");
    el.className = "banner " + kind;
    el.dataset.key = key;
    var msg = document.createElement("span");
    msg.className = "msg";
    msg.textContent = message;
    el.appendChild(msg);
    var box = document.createElement("span");
    box.className = "actions";
    (actions || []).forEach(function (a) {
      var b = document.createElement("button");
      b.textContent = a.label;
      if (a.primary) b.className = "primary";
      b.addEventListener("click", a.run);
      box.appendChild(b);
    });
    var close = document.createElement("button");
    close.className = "link";
    close.textContent = S.dismiss;
    close.addEventListener("click", function () { hideBanner(key); });
    if (key !== "conflict") box.appendChild(close);
    el.appendChild(box);
    bannersEl.appendChild(el);
  }
  function hideBanner(key) {
    Array.prototype.forEach.call(bannersEl.querySelectorAll('[data-key="' + key + '"]'), function (el) { el.remove(); });
  }

  // ---------------- Rendering ----------------
  function updateSaveState() {
    var d = dirty();
    saveStateEl.textContent = d ? S.unsaved : S.saved;
    saveStateEl.classList.toggle("dirty", d);
  }

  // Pour the text into the #mirror behind the editor and wrap commented ranges in <mark>. When probe is given,
  // put a zero-width marker at that offset (to measure where the selection is)
  function renderMirror(probe) {
    var text = state.text;
    var ranges = visibleComments().map(function (c) { return { id: c.id, start: c.start, end: c.end }; });
    if (state.draft) ranges.push({ id: "draft", start: state.draft.start, end: state.draft.end });
    var points = [0, text.length];
    ranges.forEach(function (r) { points.push(r.start, r.end); });
    if (typeof probe === "number") points.push(probe);
    points = points.filter(function (p, i, arr) { return arr.indexOf(p) === i; }).sort(function (a, b) { return a - b; });

    var frag = document.createDocumentFragment();
    var firstMark = {};
    var probeEl = null;
    for (var i = 0; i < points.length - 1; i++) {
      var from = points[i];
      var to = points[i + 1];
      if (from === probe && probeEl === null) {
        probeEl = document.createElement("span");
        frag.appendChild(probeEl);
      }
      var covering = ranges.filter(function (r) { return r.start <= from && r.end >= to && r.start < r.end; });
      var chunk = text.slice(from, to);
      if (covering.length === 0) {
        frag.appendChild(document.createTextNode(chunk));
        continue;
      }
      var mark = document.createElement("mark");
      var ids = covering.map(function (r) { return r.id; });
      if (ids.indexOf("draft") !== -1) mark.classList.add("draft");
      else if (state.activeId && ids.indexOf(state.activeId) !== -1) mark.classList.add("active");
      else if (ids.length > 1) mark.classList.add("multi");
      mark.textContent = chunk;
      ids.forEach(function (id) { if (!firstMark[id]) firstMark[id] = mark; });
      frag.appendChild(mark);
    }
    if (probe === text.length && probeEl === null) {
      probeEl = document.createElement("span");
      frag.appendChild(probeEl);
    }
    // Add a zero-width character so that an empty last line still has height
    frag.appendChild(document.createTextNode("​"));
    mirror.textContent = "";
    mirror.appendChild(frag);
    return { firstMark: firstMark, probeEl: probeEl };
  }

  function lineLabel(c) {
    return S.line(A.lineOf(state.text, c.start), A.lineOf(state.text, Math.max(c.start, c.end - 1)));
  }

  function render() {
    var sel = currentSelection();
    var probe = sel && !state.draft ? sel.end : null;
    var m = renderMirror(probe);
    renderCards(m.firstMark);
    if (probe !== null && m.probeEl) {
      addBtn.style.display = "block";
      placeAddButton(m.probeEl);
    } else {
      addBtn.style.display = "none";
    }
    updateSaveState();
  }

  function renderCards(firstMark) {
    // For a comment being edited, put the cursor back in the same place after rebuilding
    var focused = document.activeElement;
    var keep = focused && focused.classList.contains("body") && focused.dataset.commentId
      ? { id: focused.dataset.commentId, start: focused.selectionStart, end: focused.selectionEnd, before: focused.dataset.before }
      : null;

    // Lay out the placed comments (+ the draft) in the margin in order of their range's height. Overlapping ones are pushed down
    Array.prototype.forEach.call(cardsEl.querySelectorAll(".card"), function (el) { el.remove(); });
    lostEl.textContent = "";

    var lost = state.comments.filter(function (c) { return c.lost; });
    if (lost.length > 0) {
      var h = document.createElement("h2");
      h.textContent = S.lostTitle(lost.length);
      var hint = document.createElement("p");
      hint.className = "lost-hint";
      hint.textContent = S.lostHint;
      lostEl.appendChild(h);
      lostEl.appendChild(hint);
      lost.forEach(function (c) { lostEl.appendChild(buildCard(c, true)); });
    }

    // The margin's top can be far above what the user is reading, so the header says how many lost their place
    lostJumpEl.hidden = lost.length === 0;
    if (lost.length > 0) lostJumpEl.textContent = S.lostJump(lost.length);

    var entries = visibleComments().map(function (c) {
      return { comment: c, top: firstMark[c.id] ? firstMark[c.id].offsetTop : 0, start: c.start };
    });
    if (state.draft) entries.push({ comment: null, top: firstMark.draft ? firstMark.draft.offsetTop : 0, start: state.draft.start });
    entries.sort(function (a, b) { return a.top - b.top || a.start - b.start; });

    layoutEntries = entries.map(function (e) {
      var card = e.comment ? buildCard(e.comment, false) : buildDraftCard();
      cardsEl.appendChild(card);
      return { card: card, top: e.top };
    });
    Array.prototype.forEach.call(document.querySelectorAll(".card textarea.body"), autosizeBody);
    layoutCards();
    state.focusEditorOnce = false;
    if (keep) {
      var again = document.querySelector('.card textarea.body[data-comment-id="' + keep.id + '"]');
      if (again) {
        again.dataset.before = keep.before;
        again.focus({ preventScroll: true });
        again.setSelectionRange(keep.start, keep.end);
        again.closest(".card").classList.add("editing");
      }
    }
    var focusEl = cardsEl.querySelector("textarea[data-autofocus]") || lostEl.querySelector("textarea[data-autofocus]");
    if (focusEl) {
      focusEl.removeAttribute("data-autofocus");
      focusEl.focus();
      focusEl.setSelectionRange(focusEl.value.length, focusEl.value.length);
    }
  }

  // Put "+ Comment" right below the end of the selection (probe is the zero-width marker at the end of the range).
  // Near the right edge, shift it left so it does not go past the margin's right edge
  function placeAddButton(probe) {
    var lineHeight = parseFloat(getComputedStyle(mirror).lineHeight) || 28;
    var wrap = $("editor-wrap");
    var margin = $("margin");
    var maxLeft = margin.offsetLeft + margin.offsetWidth - wrap.offsetLeft - addBtn.offsetWidth;
    addBtn.style.top = probe.offsetTop + lineHeight + 2 + "px";
    addBtn.style.left = Math.max(0, Math.min(probe.offsetLeft - 8, maxLeft)) + "px";
  }

  // Reposition the margin cards from the top to match their ranges (overlapping ones are pushed down). Also called when a card's height changes
  var layoutEntries = [];
  function layoutCards() {
    var lostHeight = lostEl.offsetHeight ? lostEl.offsetHeight + 16 : 0;
    var bottom = 0;
    layoutEntries.forEach(function (e) {
      var top = Math.max(e.top - lostHeight, bottom);
      e.card.style.top = top + "px";
      bottom = top + e.card.offsetHeight + 8;
    });
    cardsEl.style.minHeight = bottom + "px";
  }

  // Inputs confirmed with Enter (Shift+Enter for a new line; the Enter that confirms IME input does not confirm). See enterKey.js
  var onPlainEnter = window.EnterKey.onPlainEnter;

  function autosizeBody(ta) {
    ta.style.height = "auto";
    ta.style.height = ta.scrollHeight + 2 + "px";
  }

  // Change only which comment is shown as active (cards are not rebuilt, so an input being edited is not lost)
  function setActive(id) {
    if (state.activeId === id) return;
    state.activeId = id;
    renderMirror(null);
    addBtn.style.display = "none";
    Array.prototype.forEach.call(document.querySelectorAll(".card[data-id]"), function (el) {
      el.classList.toggle("active", el.dataset.id === id);
    });
  }

  // The comment text input. Click to edit in place. Enter or leaving keeps the change, Esc reverts it. Clearing it restores the previous text
  function buildBody(c) {
    var ta = document.createElement("textarea");
    ta.className = "body";
    ta.rows = 1;
    ta.value = c.body;
    ta.spellcheck = false;
    ta.title = S.bodyTitle;
    ta.dataset.commentId = c.id;
    ta.addEventListener("focus", function () {
      if (ta.dataset.before === undefined) ta.dataset.before = c.body;
      ta.closest(".card").classList.add("editing");
      setActive(c.id);
      layoutCards(); // the key hint appears and the card's height changes
    });
    ta.addEventListener("input", function () {
      c.body = ta.value;
      autosizeBody(ta);
      layoutCards();
    });
    onPlainEnter(ta, function () { ta.blur(); });
    ta.addEventListener("keydown", function (e) {
      if (e.key === "Escape") {
        e.preventDefault();
        ta.value = ta.dataset.before;
        c.body = ta.value;
        autosizeBody(ta);
        ta.blur();
      }
    });
    ta.addEventListener("blur", function () {
      var before = ta.dataset.before;
      delete ta.dataset.before;
      var card = ta.closest(".card");
      if (card) card.classList.remove("editing");
      var next = ta.value.replace(/\s+$/, "");
      if (next.trim() === "") next = before;
      ta.value = next;
      c.body = next;
      autosizeBody(ta);
      layoutCards();
      if (next !== before) {
        c.updated = new Date().toISOString();
        persistComments();
      }
    });
    return ta;
  }

  function buildCard(c, isLost) {
    var card = document.createElement("div");
    card.className = "card" + (c.id === state.activeId ? " active" : "");
    card.dataset.id = c.id;
    var quote = document.createElement("div");
    quote.className = "quote";
    quote.textContent = "“" + (isLost ? c.quote : state.text.slice(c.start, c.end)) + "”";
    card.appendChild(quote);

    card.appendChild(buildBody(c));

    var meta = document.createElement("div");
    meta.className = "meta";
    var line = document.createElement("span");
    line.className = "line";
    line.textContent = isLost ? "" : lineLabel(c);
    meta.appendChild(line);
    var hint = document.createElement("span");
    hint.className = "hint";
    hint.textContent = S.bodyHint;
    meta.appendChild(hint);
    if (isLost) {
      meta.appendChild(linkButton(S.reattach, function () { reattach(c); }));
    }
    meta.appendChild(linkButton(S.remove, function () {
      state.comments = state.comments.filter(function (x) { return x !== c; });
      if (state.activeId === c.id) state.activeId = null;
      persistComments();
      render();
    }));
    card.appendChild(meta);

    // Clicking anything but the text (the quote or line number) jumps to that range in the document
    card.addEventListener("click", function (e) {
      if (e.target.closest("button") || e.target.closest("textarea")) return;
      setActive(c.id);
      if (!isLost) revealComment(c);
    });
    return card;
  }

  function linkButton(label, run) {
    var b = document.createElement("button");
    b.className = "link";
    b.textContent = label;
    // Keep the document's selection when clicked ("Attach to selection" uses it)
    b.addEventListener("mousedown", function (e) { e.preventDefault(); });
    b.addEventListener("click", function (e) {
      e.stopPropagation();
      run();
    });
    return b;
  }

  function buildDraftCard() {
    var card = document.createElement("div");
    card.className = "card draft";
    var quote = document.createElement("div");
    quote.className = "quote";
    quote.textContent = "“" + state.text.slice(state.draft.start, state.draft.end) + "”";
    card.appendChild(quote);
    card.appendChild(buildEditor(state.draft.body || "", S.commentSave, commitDraft, cancelDraft));
    return card;
  }

  // The input for a new comment. Enter confirms, Esc cancels
  function buildEditor(value, okLabel, onOk, onCancel) {
    var box = document.createElement("div");
    box.className = "compose";
    var ta = document.createElement("textarea");
    ta.value = value;
    ta.placeholder = S.commentPlaceholder;
    if (state.focusEditorOnce) ta.setAttribute("data-autofocus", "");
    ta.addEventListener("input", function () { if (state.draft) state.draft.body = ta.value; });
    onPlainEnter(ta, function () { if (ta.value.trim()) onOk(ta.value.trim()); });
    ta.addEventListener("keydown", function (e) {
      if (e.key === "Escape") {
        e.preventDefault();
        onCancel();
      }
    });
    box.appendChild(ta);
    var actions = document.createElement("div");
    actions.className = "edit-actions";
    var ok = document.createElement("button");
    ok.className = "primary";
    ok.textContent = okLabel;
    ok.addEventListener("click", function () { if (ta.value.trim()) onOk(ta.value.trim()); });
    var cancel = document.createElement("button");
    cancel.textContent = S.cancel;
    cancel.addEventListener("click", onCancel);
    var hint = document.createElement("span");
    hint.className = "hint";
    hint.textContent = S.editHint;
    actions.appendChild(ok);
    actions.appendChild(cancel);
    actions.appendChild(hint);
    box.appendChild(actions);
    return box;
  }

  // Scroll until the range is visible and put the cursor at its start (selecting it would bring up "+ Comment")
  function revealComment(c) {
    var marks = mirror.querySelectorAll("mark.active");
    if (marks.length > 0) {
      var top = marks[0].offsetTop + $("doc").offsetTop;
      if (top < scroller.scrollTop || top > scroller.scrollTop + scroller.clientHeight - 80) {
        scroller.scrollTo({ top: Math.max(0, top - 120), behavior: "smooth" });
      }
    }
    editor.focus({ preventScroll: true });
    editor.setSelectionRange(c.start, c.start);
  }

  // ---------------- Selection and comments ----------------
  function currentSelection() {
    if (document.activeElement !== editor) return null;
    if (editor.selectionStart === editor.selectionEnd) return null;
    return { start: editor.selectionStart, end: editor.selectionEnd };
  }

  // The last selection in the document. Used by "Attach to selection" even after focus moves to a comment
  var lastSelection = null;

  function onSelectionMaybeChanged() {
    if (document.activeElement !== editor) return;
    var sel = currentSelection();
    lastSelection = sel;
    var caret = editor.selectionStart;
    var hit = visibleComments().filter(function (c) { return c.start <= caret && caret <= c.end; })[0];
    var nextActive = hit ? hit.id : state.activeId;
    var key = (sel ? sel.start + ":" + sel.end : "") + "|" + nextActive;
    if (key === onSelectionMaybeChanged.lastKey) return;
    onSelectionMaybeChanged.lastKey = key;
    if (hit) state.activeId = hit.id;
    render();
  }

  function startDraft() {
    var sel = currentSelection() || lastSelection;
    if (!sel || sel.start === sel.end) return;
    state.draft = { start: sel.start, end: sel.end, body: "" };
    state.focusEditorOnce = true;
    render();
  }

  function commitDraft(body) {
    var now = new Date().toISOString();
    var c = { id: newId(), start: state.draft.start, end: state.draft.end, body: body, created: now, updated: now, lost: false };
    state.comments.push(c);
    state.draft = null;
    state.activeId = c.id;
    persistComments();
    // Leaving the selection would show "+ Comment" over the comment just added, so put the cursor at the end of the range
    editor.focus({ preventScroll: true });
    editor.setSelectionRange(c.end, c.end);
    render();
  }

  function cancelDraft() {
    state.draft = null;
    render();
    editor.focus({ preventScroll: true });
  }

  function reattach(c) {
    var sel = lastSelection;
    if (!sel || sel.start === sel.end) {
      editor.focus();
      return;
    }
    c.start = sel.start;
    c.end = sel.end;
    c.lost = false;
    state.activeId = c.id;
    persistComments();
    render();
  }

  addBtn.addEventListener("mousedown", function (e) { e.preventDefault(); });
  addBtn.addEventListener("click", startDraft);

  // ---------------- Editing the text ----------------
  editor.addEventListener("input", function () {
    var old = state.text;
    var next = editor.value;
    if (old === next) return;
    var d = A.diff(old, next, editor.selectionEnd);
    var changed = false;
    state.comments.forEach(function (c) {
      if (c.lost) return;
      var r = A.shiftRange(c, d);
      if (r === null) {
        var ctx = A.context(old, c.start, c.end);
        c.quote = ctx.quote;
        c.prefix = ctx.prefix;
        c.suffix = ctx.suffix;
        c.lost = true;
        changed = true;
      } else {
        c.start = r.start;
        c.end = r.end;
      }
    });
    if (state.draft) {
      var r = A.shiftRange(state.draft, d);
      if (r === null) state.draft = null;
      else { state.draft.start = r.start; state.draft.end = r.end; }
    }
    state.text = next;
    if (changed) persistComments();
    render();
  });
  ["select", "keyup", "mouseup", "focus"].forEach(function (type) {
    editor.addEventListener(type, onSelectionMaybeChanged);
  });
  document.addEventListener("selectionchange", onSelectionMaybeChanged);
  editor.addEventListener("keydown", function (e) {
    // Tab inserts a character instead of moving focus (via insertText, so it can be undone)
    if (e.key === "Tab" && !e.metaKey && !e.ctrlKey && !e.altKey) {
      e.preventDefault();
      document.execCommand("insertText", false, "\t");
    }
  });

  // ---------------- Saving ----------------
  function commentsForDisk() {
    return state.comments.map(function (c) {
      var anchor = c.lost ? { quote: c.quote, prefix: c.prefix || "", suffix: c.suffix || "" } : A.context(state.text, c.start, c.end);
      return {
        id: c.id,
        quote: anchor.quote,
        prefix: anchor.prefix,
        suffix: anchor.suffix,
        start: c.lost ? null : c.start,
        end: c.lost ? null : c.end,
        line: c.lost ? null : A.lineOf(state.text, c.start),
        body: c.body,
        created: c.created,
        updated: c.updated,
        lost: !!c.lost,
      };
    });
  }

  function persistComments() {
    var json = state.comments.length === 0 ? null : JSON.stringify({ version: 1, comments: commentsForDisk() }, null, 2) + "\n";
    return call("__textboardSaveComments", json).then(function (res) {
      if (!res || !res.ok) showBanner("save", "error", S.saveFailed(res ? res.error : "?"));
    }, function (err) {
      showBanner("save", "error", S.saveFailed(err.message));
    });
  }

  // true when saved
  function save() {
    if (state.conflict !== null) {
      showConflict();
      return Promise.resolve(false);
    }
    var text = state.text;
    return call("__textboardSave", toDisk(text)).then(function (res) {
      if (!res || !res.ok) {
        showBanner("save", "error", S.saveFailed(res ? res.error : "?"));
        return false;
      }
      state.saved = text;
      state.fileGone = false;
      hideBanner("save");
      hideBanner("gone");
      hideBanner("close");
      saveStateEl.title = S.savedAt(clock());
      updateSaveState();
      return persistComments().then(function () { return true; });
    }, function (err) {
      showBanner("save", "error", S.saveFailed(err.message));
      return false;
    });
  }
  $("save-btn").addEventListener("click", function () { save(); });

  // ---------------- Outside changes ----------------
  // Replace with the outside text and find each comment again by its quote and surrounding context
  function applyExternal(text) {
    var old = state.text;
    state.comments.forEach(function (c) {
      var anchor = c.lost ? { quote: c.quote, prefix: c.prefix, suffix: c.suffix, start: c.start } : Object.assign(A.context(old, c.start, c.end), { start: c.start });
      var r = A.locate(text, anchor);
      if (r) {
        c.start = r.start;
        c.end = r.end;
        c.lost = false;
      } else if (!c.lost) {
        c.quote = anchor.quote;
        c.prefix = anchor.prefix;
        c.suffix = anchor.suffix;
        c.lost = true;
      }
    });
    state.draft = null;
    var caret = Math.min(editor.selectionStart, text.length);
    var scrollTop = scroller.scrollTop;
    editor.value = text;
    state.text = text;
    state.saved = text;
    state.conflict = null;
    hideBanner("conflict");
    if (document.activeElement === editor) editor.setSelectionRange(caret, caret);
    persistComments();
    render();
    scroller.scrollTop = scrollTop;
  }

  function showConflict() {
    showBanner("conflict", "warn", S.conflict, [
      { label: S.takeDisk, run: function () { applyExternal(state.conflict); } },
      { label: S.keepMine, primary: true, run: function () { state.conflict = null; hideBanner("conflict"); save(); } },
    ]);
  }

  function onDiskChanged(raw) {
    if (raw === null) {
      state.fileGone = true;
      state.saved = null;
      showBanner("gone", "error", S.fileGone);
      updateSaveState();
      return;
    }
    var text = normalize(raw);
    hideBanner("gone");
    if (text === state.text) {
      state.saved = text;
      state.conflict = null;
      hideBanner("conflict");
      updateSaveState();
      return;
    }
    if (!dirty()) {
      applyExternal(text);
      showBanner("reloaded", "", S.reloaded(clock()));
      return;
    }
    state.conflict = text;
    hideBanner("reloaded");
    showConflict();
  }

  // ---------------- Instructions for the AI ----------------
  function buildPayload(instruction, savedBeforeSend) {
    return {
      file: state.path,
      instruction: instruction,
      comments: state.comments.map(function (c) {
        if (c.lost) return { id: c.id, line: null, endLine: null, quote: c.quote, comment: c.body, lost: true };
        return {
          id: c.id,
          line: A.lineOf(state.text, c.start),
          endLine: A.lineOf(state.text, Math.max(c.start, c.end - 1)),
          quote: state.text.slice(c.start, c.end),
          comment: c.body,
        };
      }).sort(function (a, b) { return (a.line || 1e9) - (b.line || 1e9); }),
      savedBeforeSend: savedBeforeSend,
      sentAt: new Date().toISOString(),
    };
  }

  function clipboardText(payload) {
    var lines = [S.clipboardTitle(payload.file)];
    if (payload.instruction) lines.push("", S.clipboardInstruction, payload.instruction);
    if (payload.comments.length > 0) {
      lines.push("", S.clipboardComments);
      payload.comments.forEach(function (c) {
        var where = c.lost ? S.clipboardLost : S.clipboardLine(c.line);
        lines.push("- " + where + " “" + c.quote.replace(/\n/g, " ") + "”: " + c.comment);
      });
    }
    return lines.join("\n") + "\n";
  }

  function send() {
    var instruction = instructionEl.value.trim();
    if (!instruction && state.comments.length === 0) {
      flashHint(S.nothingToSend);
      return;
    }
    if (state.conflict !== null) {
      showConflict();
      flashHint(S.conflictFirst);
      return;
    }
    var wasDirty = dirty();
    var ready = wasDirty ? save() : Promise.resolve(true);
    ready.then(function (ok) {
      if (!ok) return;
      return call("__textboardSend", buildPayload(instruction, wasDirty)).then(function (res) {
        state.lastSentId = res.id;
        state.lastSentDelivered = null;
        instructionEl.value = "";
        autosizeInstruction();
        updateAgentState(lastAgent.waiting, [res.id]);
      });
    }).catch(function (err) {
      showBanner("send", "error", err.message);
    });
  }

  function copyInstruction() {
    var payload = buildPayload(instructionEl.value.trim(), false);
    call("__textboardCopy", clipboardText(payload)).then(function (res) {
      flashHint(res && res.ok ? S.copied : S.copyFailed);
    }, function () { flashHint(S.copyFailed); });
  }

  $("send-btn").addEventListener("click", send);
  $("copy-btn").addEventListener("click", copyInstruction);

  function autosizeInstruction() {
    instructionEl.style.height = "auto";
    instructionEl.style.height = Math.min(160, Math.max(40, instructionEl.scrollHeight + 2)) + "px";
  }
  instructionEl.addEventListener("input", autosizeInstruction);
  // Enter sends. Shift+Enter inserts a new line. The Enter that confirms IME input does not send (onPlainEnter)
  onPlainEnter(instructionEl, send);

  var hintTimer = null;
  function flashHint(message) {
    var el = $("hint");
    el.textContent = message;
    clearTimeout(hintTimer);
    hintTimer = setTimeout(function () { el.textContent = S.hint; }, 4000);
  }

  var lastAgent = { waiting: false };
  function updateAgentState(waiting, pending) {
    lastAgent.waiting = waiting;
    var el = agentStateEl;
    el.className = "";
    if (state.lastSentId && pending.indexOf(state.lastSentId) !== -1) {
      el.textContent = waiting ? S.agentSent : S.agentSentIdle;
      el.className = "sent";
      return;
    }
    if (state.lastSentId && state.lastSentDelivered === null) state.lastSentDelivered = clock();
    if (waiting) {
      el.textContent = S.agentWaiting;
      el.className = "waiting";
    } else {
      el.textContent = S.agentIdle;
    }
    if (state.lastSentDelivered) el.textContent = S.agentReceived(state.lastSentDelivered) + (waiting ? " — " + S.agentWaiting : "");
  }

  // ---------------- Keys ----------------
  document.addEventListener("keydown", function (e) {
    var mod = e.metaKey || e.ctrlKey;
    if (mod && (e.key === "w" || e.key === "W")) {
      e.preventDefault();
      if (dirty() && Date.now() > state.closeArmedUntil) {
        state.closeArmedUntil = Date.now() + 4000;
        showBanner("close", "warn", S.closeArmed);
        return;
      }
      call("__textboardClose");
      return;
    }
    if (mod && (e.key === "s" || e.key === "S")) {
      e.preventDefault();
      save();
      return;
    }
    // ⌘⌥M = comment on the selection (same as Google Docs). With ⌥ held, e.key becomes µ, so check code
    if (mod && e.altKey && e.code === "KeyM") {
      e.preventDefault();
      startDraft();
      return;
    }
  });

  // ---------------- Talking to the window process ----------------
  function startPolling() {
    if (typeof window.__textboardPoll !== "function") return;
    var busy = false;
    setInterval(function () {
      if (busy) return;
      busy = true;
      call("__textboardPoll").then(function (res) {
        busy = false;
        if (res.replaceUrl) {
          var nextRid = new URL(res.replaceUrl).searchParams.get("rid");
          if (dirty()) {
            call("__textboardReady", nextRid, { refused: "unsaved" });
            showBanner("replace", "warn", S.replaceRefused);
          } else {
            window.location.replace(res.replaceUrl);
            return;
          }
        }
        if (res.disk) onDiskChanged(res.disk.text);
        updateAgentState(res.waiting, res.pending || []);
      }, function () { busy = false; });
    }, POLL_MS);
  }

  function loadComments(raw) {
    if (!raw) return;
    if (raw.error || !Array.isArray(raw.comments)) {
      showBanner("sidecar", "error", S.sidecarUnreadable(state.sidecar));
      return;
    }
    raw.comments.forEach(function (c) {
      if (typeof c.body !== "string" || typeof c.quote !== "string") return;
      var r = A.locate(state.text, { quote: c.quote, prefix: c.prefix || "", suffix: c.suffix || "", start: c.start });
      state.comments.push({
        id: c.id || newId(),
        start: r ? r.start : null,
        end: r ? r.end : null,
        body: c.body,
        created: c.created,
        updated: c.updated,
        lost: !r,
        quote: c.quote,
        prefix: c.prefix || "",
        suffix: c.suffix || "",
      });
    });
  }

  function applyLanguage() {
    document.documentElement.lang = LANG;
    Array.prototype.forEach.call(document.querySelectorAll("[data-i18n]"), function (el) {
      el.textContent = S[el.getAttribute("data-i18n")];
    });
    instructionEl.placeholder = S.instructionPlaceholder;
    addBtn.textContent = S.addComment;
    var k = document.createElement("kbd");
    k.style.color = "#cfe0ff";
    k.textContent = "⌘⌥M";
    addBtn.appendChild(k);
    $("hint").textContent = S.hint;
  }

  function init() {
    applyLanguage();
    window.addEventListener("resize", function () { render(); });
    call("__textboardLoad", RID).then(function (data) {
      state.path = data.path;
      state.sidecar = data.sidecar;
      state.lineEnding = data.text.indexOf("\r\n") !== -1 ? "\r\n" : "\n";
      state.text = normalize(data.text);
      state.saved = state.text;
      editor.value = state.text;
      $("file-name").textContent = data.name;
      $("file-dir").textContent = data.path.slice(0, data.path.length - data.name.length);
      document.title = data.name + " — textboard";
      loadComments(data.comments);
      render();
      updateAgentState(false, []);
      editor.focus({ preventScroll: true });
      editor.setSelectionRange(0, 0);
      call("__textboardReady", RID, null);
      startPolling();
    }, function (err) {
      console.error("textboard: failed to load", err);
      $("scroller").style.display = "none";
      $("composer").style.display = "none";
      var el = $("load-error");
      el.textContent = S.loadFailed;
      el.style.display = "flex";
    });
  }

  init();
})();
</script>
</body>
</html>
